<!DOCTYPE html>
<html lang="pt-BR">
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banco SENAI - Simulador de Empréstimo</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>

</head>
<body>

<div class="container" id="appContainer">
    <h2>Simulador de Empréstimo - Banco SENAI</h2>
    
    <form id="loanForm">
        <div class="form-group">
            <label for="clientName">Nome Completo (Mín. 5 caracteres):</label>
            <input type="text" id="clientName" required onblur="validatename()">            
        </div>

        <div class="form-group">
            <label for="birthDate">Data de Nascimento:</label>
            <input type="date" id="birthDate" required onblur="validatebirth()">
        </div>

        <div class="form-group">
            <label for="clientCPF">CPF (Apenas 11 números):</label>
            <input type="text" id="clientCPF"  required onblur="validatecpf()">
            
        </div>

        <div class="form-group">
            <label for="loanAmount">Valor do Empréstimo (R$):</label>
            <input type="number" id="loanAmount" step="0.01" required onblur="validateloan()">
        </div>

        <div class="form-group">
            <label for="interestRate">Taxa de Juros Simples (%):</label>
            <input type="number" id="interestRate" step="0.1" required onblur="validatefees()">
        </div>

        <div class="form-group">
            <label for="installments">Quantidade de Parcelas:</label>
            <input type="number" id="installments" required onblur="validateinstallments()">
        </div>

        <button type="button" class="btn btn-primary" id="btnCalculate" onclick="calculateLoan()">Calcular Empréstimo</button>
    </form>

    <div class="result-box" id="resultBox">
        <h3>Resumo da Simulação</h3>
        <p><strong>Idade Calculada:</strong> <span id="age"></span> </p>
        <p><strong>Montante Total com Juros:</strong> R$ <span id="resultado"></span></p>
        


        <button class="btn btn-danger" onclick="resetForm()" id="btnReset" style="margin-top: 20px;">Nova Simulação</button>
    </div>
</div>
</body>
</html>
